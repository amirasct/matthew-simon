<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Matthew Simon</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 1.5rem;
        }
        
        .admin-nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .admin-nav a {
            padding: 0.7rem 1.5rem;
            background: var(--accent-blue);
            color: white;
            border-radius: 3px;
            font-weight: 500;
        }
        
        .admin-nav a:hover {
            background: var(--accent-terracotta);
            color: white;
        }
        
        .section {
            display: none;
        }
        
        .section.active {
            display: block;
        }
        
        .products-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid var(--border-light);
        }
        
        .products-table th {
            background: var(--accent-blue);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }
        
        .products-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
        }
        
        .products-table tr:hover {
            background: #f9f8f6;
        }
        
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .action-buttons a,
        .action-buttons button {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 2px;
            border: none;
            cursor: pointer;
            color: white;
        }
        
        .btn-edit {
            background: var(--accent-gold);
        }
        
        .btn-delete {
            background: #D97757;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            background: white;
            padding: 2rem;
            border: 1px solid var(--border-light);
            margin-bottom: 2rem;
        }
        
        .form-grid.full {
            grid-template-columns: 1fr;
        }
        
        .form-group textarea {
            grid-column: 1 / -1;
        }
        
        .add-product-form {
            max-width: 1200px;
        }
        
        .add-product-form .form-grid {
            grid-template-columns: 1fr 1fr;
        }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            grid-column: 1 / -1;
        }
        
        .message {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 3px;
            display: none;
        }
        
        .message.success {
            background: #D4EDDA;
            color: #155724;
            display: block;
        }
        
        .message.error {
            background: #F8D7DA;
            color: #721C24;
            display: block;
        }
        
        .admin-section-title {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-light);
        }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-container">
        <div class="logo">Matthew Simon | Admin <span class="logo-tagline">— European Design & Antiques</span></div>
        <ul class="nav-menu">
            <li><a href="index.html">← Back to Site</a></li>
        </ul>
    </div>
</nav>

<!-- Admin Container -->
<div class="admin-container">
    <div class="admin-header">
        <h1>Admin Panel</h1>
        <p>Manage products and content</p>
    </div>
    
    <!-- Admin Navigation -->
    <div class="admin-nav">
        <a href="#" onclick="showSection('products')" class="nav-link active">Products</a>
        <a href="#" onclick="showSection('add-product')" class="nav-link">Add Product</a>
    </div>
    
    <!-- Messages -->
    <div id="message" class="message"></div>
    
    <!-- Products Section -->
    <div id="products" class="section active">
        <h2 class="admin-section-title">Current Products</h2>
        
        <div style="margin-bottom: 1rem;">
            <input type="text" id="searchProducts" placeholder="Search products..." 
                   style="padding: 0.7rem; width: 100%; max-width: 300px; border: 1px solid var(--border-light); border-radius: 3px;">
        </div>
        
        <div style="overflow-x: auto;">
            <table class="products-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Designer</th>
                        <th>Era</th>
                        <th>Price (CHF)</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <!-- Will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Add Product Section -->
    <div id="add-product" class="section">
        <h2 class="admin-section-title">Add New Product</h2>
        
        <form class="add-product-form" id="addProductForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="productName">Product Name *</label>
                    <input type="text" id="productName" name="productName" required>
                </div>
                
                <div class="form-group">
                    <label for="designer">Designer/Maker</label>
                    <input type="text" id="designer" name="designer">
                </div>
                
                <div class="form-group">
                    <label for="era">Era *</label>
                    <input type="text" id="era" name="era" placeholder="e.g., 1950s" required>
                </div>
                
                <div class="form-group">
                    <label for="condition">Condition</label>
                    <select id="condition" name="condition">
                        <option value="Excellent">Excellent</option>
                        <option value="Very Good">Very Good</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="price">Price (CHF) *</label>
                    <input type="number" id="price" name="price" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="Möbel">Möbel (Furniture)</option>
                        <option value="Glas">Glas (Glass)</option>
                        <option value="Leuchten">Leuchten (Lighting)</option>
                        <option value="Objekte">Objekte (Objects)</option>
                    </select>
                </div>
                
                <div class="form-group full">
                    <label for="story">Product Story/Description *</label>
                    <textarea id="story" name="story" placeholder="Why is this piece special? What makes it valuable?" required></textarea>
                </div>
                
                <div class="form-group full">
                    <label for="imageUrl">Image URL</label>
                    <input type="url" id="imageUrl" name="imageUrl" placeholder="https://matthew-simon.ch/...">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Product</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
// Local storage key
const STORAGE_KEY = 'matthew_simon_products';

// Load products from localStorage on page load
document.addEventListener('DOMContentLoaded', function() {
    loadProductsFromStorage();
    renderProductsTable();
    setupFormHandlers();
    setupSearch();
});

function showSection(sectionId) {
    // Hide all sections
    document.querySelectorAll('.section').forEach(section => {
        section.classList.remove('active');
    });
    
    // Show selected section
    document.getElementById(sectionId).classList.add('active');
    
    // Update nav links
    document.querySelectorAll('.admin-nav a').forEach(link => {
        link.classList.remove('active');
    });
    event.target.classList.add('active');
    
    return false;
}

function showMessage(message, type) {
    const messageEl = document.getElementById('message');
    messageEl.textContent = message;
    messageEl.className = `message ${type}`;
    
    setTimeout(() => {
        messageEl.classList.remove('success', 'error');
    }, 3000);
}

function loadProductsFromStorage() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
        window.products = JSON.parse(stored);
    }
}

function saveProductsToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(window.products));
}

function renderProductsTable() {
    const tbody = document.getElementById('productsTableBody');
    tbody.innerHTML = '';
    
    if (!window.products || window.products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No products yet. Add your first product!</td></tr>';
        return;
    }
    
    window.products.forEach((product, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${product.name}</td>
            <td>${product.designer || '-'}</td>
            <td>${product.era}</td>
            <td>CHF ${product.price.toLocaleString()}</td>
            <td>${product.category}</td>
            <td>
                <div class="action-buttons">
                    <button class="btn-edit" onclick="editProduct(${index})">Edit</button>
                    <button class="btn-delete" onclick="deleteProduct(${index})">Delete</button>
                </div>
            </td>
        `;
        tbody.appendChild(row);
    });
}

function addProduct(formData) {
    const newProduct = {
        id: window.products.length + 1,
        name: formData.get('productName'),
        designer: formData.get('designer'),
        era: formData.get('era'),
        condition: formData.get('condition'),
        price: parseInt(formData.get('price')),
        category: formData.get('category'),
        story: formData.get('story'),
        image: formData.get('imageUrl') || 'https://via.placeholder.com/300x400',
        badges: ['⭐ Authenticated']
    };
    
    if (!window.products) window.products = [];
    window.products.push(newProduct);
    
    saveProductsToStorage();
    renderProductsTable();
    
    return true;
}

function deleteProduct(index) {
    if (confirm('Are you sure you want to delete this product?')) {
        window.products.splice(index, 1);
        saveProductsToStorage();
        renderProductsTable();
        showMessage('Product deleted successfully', 'success');
    }
}

function editProduct(index) {
    alert('Edit functionality coming soon. For now, delete and re-add the product with updated info.');
}

function setupFormHandlers() {
    document.getElementById('addProductForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        
        if (addProduct(formData)) {
            showMessage('Product added successfully!', 'success');
            this.reset();
            showSection('products');
        } else {
            showMessage('Error adding product', 'error');
        }
    });
}

function setupSearch() {
    document.getElementById('searchProducts').addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('.products-table tbody tr');
        
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(searchTerm) ? '' : 'none';
        });
    });
}
</script>

</body>
</html>
